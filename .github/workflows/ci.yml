name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo clippy --all-targets -- -D warnings -W clippy::undocumented_unsafe_blocks
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run every example
        run: for e in examples/*.rs; do cargo run --release --example "$(basename "$e" .rs)" || exit 1; done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --all-targets

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-many-seeds=0..4
      - name: Every example but chaos_test under Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
        run: for e in examples/*.rs; do n=$(basename "$e" .rs); [ "$n" = chaos_test ] && continue; cargo miri run --example "$n" || exit 1; done

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, miri]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
